# Dependabot is intentionally scoped to the repo's own tooling only.
# Everything under benchmarks/, cves/, http/ and labs/ is an
# INTENTIONALLY VULNERABLE target: its dependencies are pinned on
# purpose and must never be "fixed" by dependency updates.
# (Also keep Settings -> Advanced Security -> Dependabot security
# updates OFF for this repository, or security PRs will still be
# opened against the vulnerable targets.)
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/.assets/validate"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
