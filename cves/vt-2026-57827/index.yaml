    - "vt-2026-57827.nuclei.yaml"

providers:
  docker-compose:
    path: "docker-compose.yaml"

post-install:
  - "Access the application at http://localhost:8383"
  - "Upload endpoint: POST /index.php?option=com_rsfiles&task=rsfiles.upload"
  - "Check endpoint: POST /index.php?option=com_rsfiles&task=rsfiles.checkupload"
  - "Uploaded files: /downloads/<filename>"
