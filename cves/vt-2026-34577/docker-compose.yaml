# CVE-2026-34577 - Postiz unauthenticated SSRF in GET /public/stream
# Affected: Postiz < 2.21.3 ; this lab pins v2.21.2
# WARNING: intentionally VULNERABLE. Local testing only.
# https://vulnerabletarget.com/VT-2026-34577
# Based on the upstream Postiz docker-compose: https://github.com/gitroomhq/postiz-app/blob/v2.21.2/docker-compose.yaml

services:
  postiz:
    image: ghcr.io/happyhackingspace/vt-2026-34577:v2.21.2
    container_name: vt-2026-34577
    environment:
      MAIN_URL: "http://localhost:4007"
      FRONTEND_URL: "http://localhost:4007"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:4007/api"
      JWT_SECRET: "vt-2026-34577-lab-jwt-secret"
      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    ports:
      - "4007:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    labels:
      - "vuln.cve=CVE-2026-34577"
      - "vuln.product=postiz"
      - "vuln.severity=high"

  postiz-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

  # Temporal (+ Elasticsearch visibility) is required for the Postiz backend to start
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb

  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    healthcheck:
      test: pg_isready -U temporal
      interval: 10s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_started
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
